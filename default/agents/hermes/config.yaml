model:
  default: deepseek-flash
  provider: deepseek
agent:
  max_turns: 150
display:
  tool_progress: all
stt:
  enabled: true
  provider: groq
  language: zh
  local:
    model: base
    vad: false
    no_speech_prob_threshold: 0.9
    logprob_threshold: '-2.0'
  groq:
    language: zh
voice:
  record_key: ctrl+b
  beep_enabled: true
  silence_threshold: 80
  silence_duration: 2.0
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - script execution via heredoc
  - git force push (rewrites remote history)
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
_config_version: 33
session_reset:
  mode: none
